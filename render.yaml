services:
  - type: web
    name: ai-tech-architect
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.1.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai_architect_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 4

databases:
  - name: ai_architect_db
    databaseName: ai_architect
    user: ai_architect_user
